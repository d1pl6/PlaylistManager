[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "PlaylistManager"
dynamic = ["version"]
description = "Easily add the song you're currently listening to your chosen playlists or liked tracks"
readme = "README.MD"
license = "GPL-2.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "d1pl" },
]
keywords = ["music", "playlist", "spotify", "youtube-music"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "pillow",
    "requests",
    "python-dotenv",
    "platformdirs",
    "flask",
    "flask-cors",
    "cryptography",
    "pynput",
    "pystray",
]

[project.optional-dependencies]
youtubemusic = ["ytmusicapi"]
all = [
    "ytmusicapi",
]

[project.urls]
Homepage = "https://github.com/d1pl6/PlaylistManager"
Repository = "https://github.com/d1pl6/PlaylistManager"

[tool.setuptools.dynamic]
version = { attr = "app._version.__version__" }
