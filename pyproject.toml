[build-system]
# >=77 for the PEP 639 SPDX license
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "PlaylistManager"
dynamic = ["version"]
description = "Easily add the song you're currently listening to your chosen playlists or liked tracks"
readme = "README.MD"
license = "GPL-2.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "d1pl" },
]
keywords = ["music", "playlist", "spotify", "youtube-music", "tidal", "keybindings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "pillow",
    "requests",
    "platformdirs",
    "flask",
    "flask-cors",
    "pynput",
    "py-minisign",
]

[project.optional-dependencies]
keyring = ["keyring"]
youtubemusic = ["ytmusicapi"]
tray = ["pystray"]
test = ["pytest", "keyring"]
all = [
    "keyring",
    "ytmusicapi",
    "pystray"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/d1pl6/PlaylistManager"
Repository = "https://github.com/d1pl6/PlaylistManager"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["app*", "integrations*"]

[tool.setuptools.package-data]
"*" = [
    "i18n/*.ini",       # translation catalogs (app/i18n/)
    "plugin.json",      # the plugin manifest (integrations/<dir>/)
    "*.png",            # plugin logo
    "*-extension/*",    # browser extension, e.g. integrations/<dir>/yt-extension/
    "*-extension/*/*",  # ... and its icons/ subfolder
]

[tool.setuptools.dynamic]
version = { attr = "app._version.__version__" }
